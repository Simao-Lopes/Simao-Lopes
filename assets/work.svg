<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-label="Selected work">
  <style>
    /* NB: no font-size in these shorthands — attributes must win, or every plate
       renders at the class size and the rows collide. */
    .label { font-family: ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace; font-weight: 600; letter-spacing: 4px; fill: #9aa1ad; }
    .name  { font-family: 'Helvetica Neue',Helvetica,Arial,sans-serif; font-weight: 800; fill: #f4f5f7; }
    .thesis{ font-family: Georgia,'Times New Roman',serif; font-weight: 400; fill: #f4f5f7; }
    .proof { font-family: ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace; font-weight: 600; letter-spacing: 2.5px; fill: #79e0b8; }
    .url   { font-family: ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace; font-weight: 500; letter-spacing: 1.5px; fill: #9aa1ad; }
    .beam  { animation: sweep 6.5s ease-in-out infinite; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes sweep { 0% { transform: translateX(-120px); opacity: 0 }
      15% { opacity: .85 } 60% { opacity: .35 } 100% { transform: translateX(320px); opacity: 0 } }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .beam,.caret { animation: none } }
  </style>
  <rect width="1400" height="600" fill="#0a0b0d"/>
  <text x="64" y="88" class="label" font-size="21">SELECTED WORK</text>
  <line x1="64" y1="112" x2="1336" y2="112" stroke="#24272e" stroke-width="2"/>
  
  <g>
    <line x1="64" y1="150" x2="1336" y2="150" stroke="#24272e" stroke-width="2"/>
    <text x="64" y="196" class="name" font-size="36" letter-spacing="-0.6">free-llm-services</text>
    <text x="64" y="228" class="proof" font-size="19" fill="#79e0b8">PYTHON / PUBLIC</text>
    <text x="1336" y="202" text-anchor="end" class="thesis" font-size="25" fill="#9aa1ad">Free LLM API tiers, re-verified weekly.</text>
  </g>
  <g>
    <line x1="64" y1="260" x2="1336" y2="260" stroke="#24272e" stroke-width="2"/>
    <text x="64" y="306" class="name" font-size="36" letter-spacing="-0.6">dev-farm</text>
    <text x="64" y="338" class="proof" font-size="19" fill="#79e0b8">SHELL / PUBLIC</text>
    <text x="1336" y="312" text-anchor="end" class="thesis" font-size="25" fill="#9aa1ad">Three-Mac code-pod farm on a mesh.</text>
  </g>
  <g>
    <line x1="64" y1="370" x2="1336" y2="370" stroke="#24272e" stroke-width="2"/>
    <text x="64" y="416" class="name" font-size="36" letter-spacing="-0.6">hassius</text>
    <text x="64" y="448" class="proof" font-size="19" fill="#79e0b8">TS / PRIVATE</text>
    <text x="1336" y="422" text-anchor="end" class="thesis" font-size="25" fill="#9aa1ad">Spec repos, agent runs, human-gated PRs.</text>
  </g>
  <g>
    <line x1="64" y1="480" x2="1336" y2="480" stroke="#24272e" stroke-width="2"/>
    <text x="64" y="526" class="name" font-size="36" letter-spacing="-0.6">v100_engines</text>
    <text x="64" y="558" class="proof" font-size="19" fill="#79e0b8">PYTHON / PRIVATE</text>
    <text x="1336" y="532" text-anchor="end" class="thesis" font-size="25" fill="#9aa1ad">Modern LLMs on one Tesla V100.</text>
  </g>
</svg>
