<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-label="Quest log — career">
  <style>
    .lab { font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace; font-weight:600; letter-spacing:3.5px; fill:#8f97a3; }
    .big { font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace; font-weight:700; letter-spacing:-1px; fill:#f4f5f7; }
    .txt { font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace; font-weight:400; fill:#8f97a3; }
    .val { font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace; font-weight:700; fill:#f4f5f7; }
    .accent { fill:#f0b45e; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }
    @media (prefers-reduced-motion: reduce) { .blink {animation:none} }
  </style>
  <rect width="1400" height="420" fill="#0a0b0d"/>
  <text x="64" y="76" class="lab" font-size="22">QUEST LOG // CAREER</text>
  <line x1="64" y1="96" x2="1336" y2="96" stroke="#23262d" stroke-width="2"/>
  
  <g>
    <rect x="64" y="130" width="1272" height="78" fill="#0a0b0d" stroke="#23262d"/>
    <rect x="64" y="130" width="6" height="78" fill="#f0b45e"/>
    <text x="92" y="161" class="lab" font-size="20" fill="#f0b45e">ACT III</text>
    <text x="92" y="192" class="big" font-size="30">CTO</text>
    <text x="400" y="179" class="txt" font-size="22">Leading the team and making the whole company AI-first.</text>
    <text x="1308" y="161" text-anchor="end" class="lab" font-size="18" fill="#f0b45e">ACTIVE</text>
  </g>
  <g>
    <rect x="64" y="226" width="1272" height="78" fill="#0a0b0d" stroke="#23262d"/>
    <rect x="64" y="226" width="6" height="78" fill="#7ee0b0"/>
    <text x="92" y="257" class="lab" font-size="20" fill="#7ee0b0">ACT II</text>
    <text x="92" y="288" class="big" font-size="30">HEAD OF AI</text>
    <text x="400" y="275" class="txt" font-size="22">Shipped a fleet of AI-powered microservices.</text>
    <text x="1308" y="257" text-anchor="end" class="lab" font-size="18" fill="#7ee0b0">CLEARED</text>
  </g>
  <g>
    <rect x="64" y="322" width="1272" height="78" fill="#0a0b0d" stroke="#23262d"/>
    <rect x="64" y="322" width="6" height="78" fill="#b79cff"/>
    <text x="92" y="353" class="lab" font-size="20" fill="#b79cff">ACT I</text>
    <text x="92" y="384" class="big" font-size="30">SOLO BUILD</text>
    <text x="400" y="371" class="txt" font-size="22">Built a full chatbot alone — 6 months in production.</text>
    <text x="1308" y="353" text-anchor="end" class="lab" font-size="18" fill="#b79cff">LEGENDARY</text>
  </g>
</svg>
