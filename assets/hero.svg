<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-label="Simão Lopes — AI that runs on hardware you already own">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79e0b8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#79e0b8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#79e0b8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8b15c" stop-opacity=".14"/>
      <stop offset="1" stop-color="#e8b15c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    /* NB: no font-size in these shorthands — attributes must win, or every plate
       renders at the class size and the rows collide. */
    .label { font-family: ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace; font-weight: 600; letter-spacing: 4px; fill: #9aa1ad; }
    .name  { font-family: 'Helvetica Neue',Helvetica,Arial,sans-serif; font-weight: 800; fill: #f4f5f7; }
    .thesis{ font-family: Georgia,'Times New Roman',serif; font-weight: 400; fill: #f4f5f7; }
    .proof { font-family: ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace; font-weight: 600; letter-spacing: 2.5px; fill: #79e0b8; }
    .url   { font-family: ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace; font-weight: 500; letter-spacing: 1.5px; fill: #9aa1ad; }
    .beam  { animation: sweep 6.5s ease-in-out infinite; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes sweep { 0% { transform: translateX(-120px); opacity: 0 }
      15% { opacity: .85 } 60% { opacity: .35 } 100% { transform: translateX(320px); opacity: 0 } }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .beam,.caret { animation: none } }
  </style>
  <rect width="1400" height="520" fill="#0a0b0d"/>

  <text x="64" y="88" class="label" font-size="21">SIMÃO LOPES</text>
  <text x="1336" y="88" text-anchor="end" class="label" font-size="21">PORTO · PORTUGAL</text>
  <line x1="64" y1="112" x2="1336" y2="112" stroke="#24272e" stroke-width="2"/>

  <text x="62" y="238" class="name" font-size="86">AI that runs on</text>
  <text x="62" y="330" class="thesis" font-size="62">hardware you <tspan font-style="italic" fill="#e8b15c">already own</tspan>.</text>

  <text x="64" y="404" class="proof" font-size="26">ONE V100 · THREE MACS · NO CLOUD</text>
  <text x="64" y="462" class="url" font-size="22">github.com/Simao-Lopes<tspan class="caret" fill="#79e0b8">▌</tspan></text>

